<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>나의 활동 기록</title>
  <style>
    :root {
      --bg: #f9f5ff;
      --surface: #ffffff;
      --surface-2: #fff7fb;
      --lavender: #e9dfff;
      --lavender-strong: #6d57d2;
      --pink: #ffdfe8;
      --pink-strong: #b9547d;
      --mint: #dff6ed;
      --mint-strong: #2c7d62;
      --yellow: #fff3c7;
      --yellow-strong: #8b6a00;
      --ink: #2d2941;
      --muted: #6f6782;
      --line: #eadff6;
      --shadow: 0 14px 32px rgba(97, 83, 151, 0.08);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: linear-gradient(180deg, #f9f5ff 0%, #fdf7ff 100%);
      font-family: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
      color: var(--ink);
    }

    body { padding: 24px 16px 56px; }
    .wrap { max-width: 560px; margin: 0 auto; }
    .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
    .badge { display: inline-flex; align-items: center; justify-content: center; min-width: 84px; height: 36px; padding: 0 14px; border-radius: 999px; background: var(--lavender); color: var(--lavender-strong); font-weight: 700; font-size: 13px; }
    .title { margin: 0; font-size: clamp(28px, 5vw, 42px); line-height: 1.2; letter-spacing: -0.04em; }
    .subtitle { margin: 8px 0 0; color: var(--muted); font-size: 15px; }
    .card { background: var(--surface); border: 1px solid var(--line); border-radius: 26px; padding: 18px 18px 16px; box-shadow: var(--shadow); margin-top: 18px; }
    .card.soft { background: linear-gradient(180deg, var(--surface-2), var(--surface)); }
    .card.pink { background: var(--pink); }
    .card.lavender { background: var(--lavender); }
    .card.mint { background: var(--mint); }
    .card.yellow { background: var(--yellow); }
    .label { display: inline-block; margin-bottom: 12px; font-size: 12px; font-weight: 800; letter-spacing: 0.08em; color: var(--muted); text-transform: uppercase; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid rgba(109, 87, 210, 0.14); }
    .row:last-child { border-bottom: none; padding-bottom: 0; }
    .key { color: var(--muted); font-weight: 700; min-width: 112px; }
    .value { text-align: right; font-weight: 800; line-height: 1.5; overflow-wrap: anywhere; }
    .score { font-size: 25px; font-weight: 900; letter-spacing: -0.05em; color: var(--lavender-strong); }
    .certs { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
    .certs li { background: rgba(255,255,255,0.45); border: 1px solid rgba(109, 87, 210, 0.18); border-radius: 16px; padding: 10px 12px; font-weight: 700; }
    @media (min-width: 640px) { body { padding-top: 32px; } }
  </style>
</head>
<body>
  <main class="wrap">
    <header class="header">
      <div>
        <h1 class="title">나의 활동 기록</h1>
        <p class="subtitle">간호학과 학습과 활동을 한눈에 정리</p>
      </div>
      <span class="badge">활동</span>
    </header>

    <section class="card lavender" aria-labelledby="activity-title">
      <span class="label" id="activity-title">참여 기록</span>
      <div class="row"><span class="key">활동명</span><span class="value">고양이</span></div>
      <div class="row"><span class="key">날짜</span><span class="value">11월 9일</span></div>
      <div class="row"><span class="key">역할</span><span class="value">고양이 2</span></div>
    </section>

    <section class="card mint" aria-labelledby="grade-title">
      <span class="label" id="grade-title">성적</span>
      <div class="row"><span class="key">과목</span><span class="value score">인간관계와 대학생활</span></div>
      <div class="row"><span class="key">점수</span><span class="value score">78점</span></div>
    </section>

    <section class="card yellow" aria-labelledby="cert-title">
      <span class="label" id="cert-title">자격증</span>
      <ul class="certs">
        <li>ITQ</li>
        <li>기본인명구조사</li>
      </ul>
    </section>

    <section class="card pink soft" aria-labelledby="school-title">
      <span class="label" id="school-title">학교 활동</span>
      <div class="row"><span class="key">활동</span><span class="value">실습 준비</span></div>
    </section>
  </main>
</body>
</html>
