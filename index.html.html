<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f4ff"><title>간호 공부 노트</title>
<style>
:root{color-scheme:light;--bg:#f7f4ff;--paper:#fff;--ink:#302a49;--muted:#6d6783;--line:#e7e1f2;--lav:#e9e1ff;--lavink:#5d48ab;--deep:#725bd0;--pink:#ffe1eb;--pinkink:#a13f68;--mint:#d9f4e8;--mintink:#276d56;--yellow:#fff2c9;--bad:#ffe2df;--shadow:0 8px 24px #46347712;font:16px/1.6 system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink)}button,input,textarea{font:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}.app{max-width:680px;margin:auto;padding:10px 16px calc(100px + env(safe-area-inset-bottom))}.top{min-height:54px;display:flex;align-items:center;justify-content:space-between;gap:12px}.back{border:1px solid var(--line);border-radius:99px;background:#fff;padding:7px 14px;min-height:42px;font-weight:700}.status{font-size:13px;color:var(--muted)}h1,h2,p{margin:0}h1{font-size:29px;line-height:1.25;letter-spacing:-.04em}h2{font-size:19px}.muted{color:var(--muted)}.hero{position:relative;padding:16px 0 20px;min-height:116px}.hero p{margin-top:7px;color:var(--muted)}.sticker{position:absolute;right:9px;top:15px;width:68px;height:68px;display:grid;place-items:center;border-radius:24px;background:var(--pink);font-size:33px;transform:rotate(7deg)}.subject{display:flex;align-items:center;gap:14px;padding:17px;border-radius:25px;background:var(--lav);box-shadow:var(--shadow);margin:8px 0 18px}.icon{width:54px;height:54px;display:grid;place-items:center;flex:none;border-radius:19px;background:white;font-size:27px}.subject b{display:block;font-size:20px}.subject small{color:var(--lavink)}.headrow{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:17px 0 10px}.units{display:grid;gap:10px}.unit{display:flex;align-items:center;gap:12px;padding:14px 15px;min-height:68px;border:1px solid var(--line);border-radius:20px;background:white;box-shadow:0 3px 12px #46347708}.dot{width:11px;height:11px;border-radius:50%;background:var(--deep);flex:none}.unitmain{flex:1;min-width:0}.unitmain b{display:block;overflow-wrap:anywhere}.unitmain small{color:var(--muted)}.arrow{font-size:22px;color:var(--muted)}.box,.item,.quizbox{margin-top:14px;padding:16px;border:1px solid var(--line);border-radius:22px;background:#fff}.label{display:block;margin:11px 0 6px;color:var(--muted);font-size:14px;font-weight:700}input[type=text],textarea{width:100%;min-height:46px;padding:10px 13px;border:2px solid var(--line);border-radius:15px;background:#fff;color:var(--ink)}textarea{resize:vertical;line-height:1.65}.row{display:flex;gap:8px}.row input{flex:1;min-width:0}.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:9px 16px;border:0;border-radius:99px;background:var(--lav);color:var(--lavink);font-weight:750}.btn.primary{background:var(--deep);color:#fff}.btn.pink{background:var(--pink);color:var(--pinkink)}.btn.ghost{border:1px solid var(--line);background:transparent;color:var(--muted)}.btn.danger{color:#9e3d4c}.btn:disabled{opacity:.5}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.note{margin:12px 0;padding:11px 14px;border-radius:16px;background:var(--yellow);color:#715900;font-size:14px}.tabs{position:fixed;z-index:5;bottom:0;left:0;right:0;padding:8px 12px calc(8px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:#f7f4ffed;backdrop-filter:blur(10px)}.tabsin{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:640px;margin:auto}.tab{min-height:46px;border:0;border-radius:99px;background:transparent;color:var(--muted);font-weight:750}.tab[aria-selected=true]{background:var(--lav);color:var(--lavink)}.unithead{padding:8px 0 12px}.unithead p{font-size:14px;color:var(--muted);margin-top:5px}.summary{min-height:300px;background-image:repeating-linear-gradient(to bottom,transparent 0 31px,#ece8f5 31px 32px);line-height:32px}.flash{width:100%;min-height:245px;margin-top:14px;padding:20px;border:2px solid var(--line);border-radius:25px;background:#fff;color:var(--ink);box-shadow:var(--shadow);text-align:center;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:12px}.flash.backside{background:var(--mint)}.flash small{color:var(--muted);font-weight:700}.flash strong{font-size:27px;line-height:1.4;overflow-wrap:anywhere;white-space:pre-wrap}.cardnav{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px}.cardnav span{font-weight:750}.item p{margin-top:5px;color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere}.quizbox{text-align:center}.quizbox .prompt{font-size:14px;color:var(--muted)}.quiz-term{font-size:25px;font-weight:850;margin:14px 0 8px}.meaning{padding:16px;border-radius:18px;background:var(--lav);font-size:18px;overflow-wrap:anywhere}.oxrow{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin:13px 0}.ox{min-height:78px;border:2px solid var(--line);border-radius:20px;background:#f1fbf6;color:var(--mintink);font-size:27px;font-weight:850}.ox:last-child{background:#fff3f2;color:#a04450}.feedback{margin:12px 0;padding:11px;border-radius:15px;background:var(--mint)}.feedback.wrong{background:var(--bad)}.score{font-size:46px;font-weight:900}.empty{text-align:center;padding:22px;border:1px dashed var(--line);border-radius:20px;color:var(--muted);margin-top:12px}.dangerzone{margin-top:26px;padding-top:16px;border-top:1px dashed var(--line)}.progress{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin:8px 0}.progress i{display:block;height:100%;background:var(--deep)}.file{width:100%;margin-top:8px}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #8e7ae4;outline-offset:3px}@media(min-width:700px){.app{padding-top:24px}.units{grid-template-columns:1fr 1fr}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body><main id="app" class="app"></main>
<script>
(function(){'use strict';
var KEY='nursing-notes-v1',app=document.getElementById('app'),timer=null;
function id(){return 'i'+Math.random().toString(36).slice(2,10)}
function card(term,def){return{id:id(),term:term,def:def,known:false}}
function sample(title,summary,pairs){return{id:id(),title:title,example:true,summary:summary,cards:pairs.map(function(x){return card(x[0],x[1])}),quiz:null}}
function initial(){return{version:1,subjects:[{id:'body',name:'인체구조와 기능',units:[
 sample('인체의 구성과 항상성','인체는 세포 → 조직 → 기관 → 기관계 → 개체의 단계로 구성된다. 항상성은 외부 환경이 변해도 체내 환경을 일정하게 유지하려는 조절 작용이다.\n\n예시 요약이므로 수업 자료에 맞게 고쳐 쓰세요.',[['항상성','외부 환경 변화에도 체내 환경을 일정하게 유지하려는 조절 작용'],['세포','생명체를 이루는 구조적·기능적 기본 단위'],['조직','비슷한 구조와 기능을 가진 세포들이 모인 것'],['기관','여러 종류의 조직이 모여 특정 기능을 수행하는 구조']]),
 sample('세포와 조직','세포막은 세포 안팎의 물질 이동을 조절한다. 세포질에는 세포소기관이 있으며, 핵에는 유전 정보가 들어 있다. 기본 조직은 상피·결합·근육·신경 조직이다.',[['세포막','세포를 둘러싸며 물질 출입을 선택적으로 조절하는 막'],['핵','유전 정보를 보관하고 세포 활동을 조절하는 세포소기관'],['미토콘드리아','세포 호흡을 통해 ATP를 생성하는 세포소기관'],['상피조직','몸 표면과 기관 안쪽을 덮어 보호·흡수·분비하는 조직']]),
 sample('뼈대계통','뼈대계통은 몸을 지지하고 내부 장기를 보호하며 움직임을 돕는다. 골수는 혈구 생성에 관여하고 뼈는 무기질을 저장한다.',[['골격','몸을 지지하고 장기를 보호하며 움직임을 돕는 뼈의 구조'],['골수','뼈 속 공간에 있으며 혈구 생성 등에 관여하는 조직'],['관절','둘 이상의 뼈가 만나는 연결 부위'],['골막','관절면을 제외한 뼈의 바깥 표면을 덮는 막']]),
 sample('심장과 순환','심장은 오른심방·오른심실·왼심방·왼심실의 네 방으로 이루어진다. 오른쪽 심장은 폐순환, 왼쪽 심장은 온몸순환을 담당한다.',[['오른심방','온몸에서 돌아온 혈액을 받아들이는 심장의 방'],['오른심실','혈액을 폐동맥을 통해 폐로 내보내는 심장의 방'],['왼심방','폐에서 돌아온 혈액을 받아들이는 심장의 방'],['왼심실','혈액을 대동맥을 통해 온몸으로 내보내는 심장의 방'],['동맥','심장에서 나가는 혈액이 흐르는 혈관'],['정맥','심장으로 돌아오는 혈액이 흐르는 혈관']])
]}]}}
function normalize(d){if(!d||!Array.isArray(d.subjects))return null;d.subjects.forEach(function(s){if(!Array.isArray(s.units))s.units=[];s.units.forEach(function(u){if(!u.id)u.id=id();if(!Array.isArray(u.cards))u.cards=[];u.summary=String(u.summary||'');u.cards.forEach(function(c){if(!c.id)c.id=id();c.term=String(c.term||'');c.def=String(c.def||'');c.known=!!c.known})})});return d}
var data;try{data=normalize(JSON.parse(localStorage.getItem(KEY)||'null'))||initial()}catch(e){data=initial()}
var ui={page:'home',unitId:null,tab:'summary',index:0,flipped:false,quiz:null,editId:null};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function save(){var st=document.querySelector('[data-status]');if(st)st.textContent='저장 중…';clearTimeout(timer);timer=setTimeout(function(){try{localStorage.setItem(KEY,JSON.stringify(data));var x=document.querySelector('[data-status]');if(x)x.textContent='저장됨'}catch(e){var x=document.querySelector('[data-status]');if(x)x.textContent='저장 실패 · 백업해 주세요'}},350)}
function unit(){return data.subjects[0].units.find(function(u){return u.id===ui.unitId})||null}
function top(back,label){return'<header class="top"><a class="back" href="'+back+'">‹ '+label+'</a><span class="status" data-status role="status" aria-live="polite">자동 저장</span></header>'}
function header(){return'<section class="hero"><h1>간호 공부 노트</h1><p>한 단원씩, 내 속도로 차근차근 🌷</p><span class="sticker" aria-hidden="true">♡</span></section>'}
function home(){var s=data.subjects[0],n=s.units.reduce(function(a,u){return a+u.cards.length},0),k=s.units.reduce(function(a,u){return a+u.cards.filter(function(c){return c.known}).length},0);return header()+'<a class="subject" href="#subject"><span class="icon">✿</span><span><b>'+esc(s.name)+'</b><small>단원 '+s.units.length+'개 · 외운 카드 '+k+'/'+n+'</small></span><span class="arrow">›</span></a><div class="progress"><i style="width:'+(n?Math.round(k/n*100):0)+'%"></i></div><p class="muted">과목을 눌러 단원을 골라요</p><p class="note">예시 단원은 참고용이에요. 교재와 수업 자료에 맞게 수정해 주세요.</p><div class="actions"><a class="btn" href="#backup">내 기록 백업</a></div>'}
function subjectPage(){var s=data.subjects[0],list=s.units.map(function(u){return'<li><a class="unit" href="#unit-'+encodeURIComponent(u.id)+'"><i class="dot"></i><span class="unitmain"><b>'+esc(u.title)+(u.example?' <small>예시</small>':'')+'</b><small>요약 '+(u.summary.trim()?'작성됨':'미작성')+' · 카드 '+u.cards.length+'장</small></span><span class="arrow">›</span></a></li>'}).join('');return top('#','홈')+'<section class="subject"><span class="icon">✿</span><span><b>'+esc(s.name)+'</b><small>단원 목록</small></span></section><div class="headrow"><h2>단원</h2><span class="muted">'+s.units.length+'개</span></div>'+(s.units.length?'<ul class="units">'+list+'</ul>':'<div class="empty">단원을 추가해 공부를 시작해요.</div>')+'<form class="box" data-form="unit"><h2>새 단원 추가</h2><label class="label" for="new-unit">단원 이름</label><div class="row"><input id="new-unit" maxlength="60" required placeholder="예: 호흡계통"><button class="btn primary">추가</button></div></form>'}
function tabs(){return'<nav class="tabs" aria-label="단원 메뉴"><div class="tabsin">'+[['summary','요약'],['cards','카드'],['quiz','퀴즈']].map(function(t){return'<button class="tab" type="button" data-action="tab" data-tab="'+t[0]+'" aria-selected="'+(ui.tab===t[0])+'">'+t[1]+'</button>'}).join('')+'</div></nav>'}
function summaryView(u){return(u.example?'<p class="note">예시 단원이에요. 제목과 내용을 자유롭게 고칠 수 있어요.</p>':'')+'<label class="label" for="summary">내가 정리한 요약</label><textarea class="summary" id="summary" placeholder="교재를 읽고 핵심을 내 말로 정리해 보세요.">'+esc(u.summary)+'</textarea><section class="dangerzone"><h2>단원 관리</h2><label class="label" for="rename">단원 이름</label><div class="row"><input id="rename" value="'+esc(u.title)+'" maxlength="60"><button class="btn" data-action="rename">저장</button></div><div class="actions"><button class="btn ghost danger" data-action="delete-unit">단원 삭제</button></div></section>'}
function addCardForm(){return'<form class="box" data-form="card"><h2>용어 카드 추가</h2><label class="label" for="term">용어</label><input id="term" maxlength="80" required placeholder="예: 항상성"><label class="label" for="definition">뜻</label><textarea id="definition" rows="3" required placeholder="용어의 뜻을 적어 보세요"></textarea><div class="actions"><button class="btn primary">카드 추가</button></div></form>'}
function cardList(u){if(!u.cards.length)return'<div class="empty">아직 카드가 없어요. 아래에서 용어와 뜻을 입력해 보세요.</div>';return'<div class="headrow"><h2>카드 목록</h2><span class="muted">'+u.cards.length+'장</span></div>'+u.cards.map(function(c){if(ui.editId===c.id)return'<form class="item" data-form="edit-card" data-id="'+esc(c.id)+'"><label class="label" for="edit-term">용어</label><input id="edit-term" value="'+esc(c.term)+'" required><label class="label" for="edit-def">뜻</label><textarea id="edit-def" rows="3" required>'+esc(c.def)+'</textarea><div class="actions"><button class="btn primary">저장</button><button type="button" class="btn ghost" data-action="cancel-edit">취소</button></div></form>';return'<article class="item"><b>'+esc(c.term)+'</b>'+(c.known?' ✓':'')+'<p>'+esc(c.def)+'</p><div class="actions"><button class="btn" data-action="edit-card" data-id="'+esc(c.id)+'">수정</button><button class="btn ghost danger" data-action="delete-card" data-id="'+esc(c.id)+'">삭제</button></div></article>'}).join('')}
function cardsView(u){if(!u.cards.length)return addCardForm()+cardList(u);if(ui.index>=u.cards.length)ui.index=0;var c=u.cards[ui.index],known=u.cards.filter(function(x){return x.known}).length;return'<div class="headrow"><h2>용어 외우기</h2><span class="muted">외운 카드 '+known+' / '+u.cards.length+'</span></div><div class="progress"><i style="width:'+Math.round(known/u.cards.length*100)+'%"></i></div><button class="flash '+(ui.flipped?'backside':'')+'" data-action="flip" aria-label="카드 뒤집기"><small>'+ (ui.flipped?'뜻':'용어') +(c.known?' · 외웠어요':'')+'</small><strong>'+esc(ui.flipped?c.def:c.term)+'</strong><small>카드를 누르면 뒤집혀요</small></button><div class="cardnav"><button class="btn ghost" data-action="prev" aria-label="이전 카드">← 이전</button><span>'+(ui.index+1)+' / '+u.cards.length+'</span><button class="btn ghost" data-action="next" aria-label="다음 카드">다음 →</button></div><div class="actions"><button class="btn pink" data-action="known" data-known="false">다시 볼래요</button><button class="btn primary" data-action="known" data-known="true">✓ 외웠어요</button></div>'+addCardForm()+cardList(u)}
function quizReady(u){return u.cards.length>=2&&u.cards.some(function(a,i){return u.cards.some(function(b,j){return i!==j&&a.def.trim().toLowerCase()!==b.def.trim().toLowerCase()})})}
function startQuiz(u){var cards=u.cards.slice().sort(function(){return Math.random()-.5}).slice(0,10);ui.quiz={phase:'q',qs:cards.map(function(c){var others=u.cards.filter(function(x){return x.id!==c.id&&x.def.trim().toLowerCase()!==c.def.trim().toLowerCase()}),truth=!others.length||Math.random()<.5;return{id:c.id,truth:truth,shown:truth?c.def:others[Math.floor(Math.random()*others.length)].def}}),i:0,right:0,wrong:[],answer:null}}
function quizView(u){var q=ui.quiz;if(!q)return'<section class="quizbox"><div style="font-size:36px">✦</div><h2>O/X 퀴즈</h2><p class="muted">용어와 뜻이 맞으면 O, 틀리면 X를 선택해요.</p><p class="note">카드 내용으로 최대 '+Math.min(u.cards.length,10)+'문제를 만들어요.</p><button class="btn primary" data-action="start-quiz" '+(!quizReady(u)?'disabled':'')+'>퀴즈 시작</button>'+(!quizReady(u)?'<p class="muted" style="margin-top:10px">서로 다른 뜻을 가진 카드가 2장 이상 필요해요.</p>':'')+'</section>';if(q.phase==='result'){var wrong=q.wrong.map(function(cid){return u.cards.find(function(c){return c.id===cid})}).filter(Boolean);return'<section class="quizbox"><div style="font-size:34px">🌟</div><p class="score">'+q.right+' / '+q.qs.length+'</p><h2>'+q.score+'점 · '+(q.score>=90?'아주 잘했어요!':q.score>=60?'잘하고 있어요!':'다시 복습해 봐요.')+'</h2></section>'+(wrong.length?'<h2 class="headrow">다시 볼 용어</h2>'+wrong.map(function(c){return'<article class="item"><b>'+esc(c.term)+'</b><p>'+esc(c.def)+'</p></article>'}).join(''):'<p class="note">틀린 문제가 없어요. 완벽해요!</p>')+'<div class="actions"><button class="btn primary" data-action="start-quiz">다시 도전</button><button class="btn" data-action="reset-quiz">퀴즈 종료</button></div>'}var item=q.qs[q.i],c=u.cards.find(function(x){return x.id===item.id});if(!c){ui.quiz=null;return quizView(u)}return'<section class="quizbox"><div class="headrow"><span>'+(q.i+1)+' / '+q.qs.length+'</span><span>O/X 퀴즈</span></div><div class="progress"><i style="width:'+Math.round(q.i/q.qs.length*100)+'%"></i></div><p class="prompt">이 용어와 뜻이 맞을까요?</p><div class="quiz-term">'+esc(c.term)+'</div><div class="meaning">'+esc(item.shown)+'</div>'+(q.answer===null?'<div class="oxrow"><button class="ox" data-action="answer" data-value="true">O<br><small>맞아요</small></button><button class="ox" data-action="answer" data-value="false">X<br><small>틀려요</small></button></div>':'<div class="feedback '+(q.answer===item.truth?'':'wrong')+'">'+(q.answer===item.truth?'정답이에요!':('아쉬워요. 올바른 뜻: '+esc(c.def)))+'</div><button class="btn primary" data-action="quiz-next">'+(q.i===q.qs.length-1?'결과 보기':'다음 문제')+'</button>')+'</section>'}
function unitPage(u){var body=ui.tab==='cards'?cardsView(u):ui.tab==='quiz'?quizView(u):summaryView(u);return top('#subject',data.subjects[0].name)+'<div class="unithead"><h1>'+esc(u.title)+'</h1><p>요약하고, 용어를 외우고, 퀴즈로 확인해요</p></div>'+body+tabs()}
function backupPage(){return top('#','홈')+'<h1>내 기록 백업</h1><p class="muted" style="margin-top:7px">자료는 이 브라우저에만 저장됩니다. 다른 기기로 옮길 때 백업 파일을 사용하세요.</p><section class="box"><h2>내보내기</h2><p class="muted">과목 '+data.subjects.length+'개 · 단원 '+data.subjects.reduce(function(n,s){return n+s.units.length},0)+'개</p><div class="actions"><button class="btn primary" data-action="export">JSON 파일로 저장</button></div></section><section class="box"><h2>불러오기</h2><p class="muted">불러오면 현재 자료를 교체합니다. 가져오기 전에 백업해 두세요.</p><label class="label" for="import-file">백업 파일 선택</label><input class="file" id="import-file" type="file" accept=".json,application/json"><button class="btn" data-action="import">파일 불러오기</button><p id="import-msg" class="note" hidden></p></section>'}
function render(){var hash=location.hash||'#home',html;if(hash==='#subject'){ui.page='subject';ui.unitId=null;html=subjectPage()}else if(hash.indexOf('#unit-')===0){var u=data.subjects[0].units.find(function(x){return x.id===decodeURIComponent(hash.slice(6))});if(!u){location.hash='#subject';return}if(ui.unitId!==u.id){ui.unitId=u.id;ui.tab='summary';ui.index=0;ui.flipped=false;ui.quiz=null;ui.editId=null}ui.page='unit';html=unitPage(u)}else if(hash==='#backup'){ui.page='backup';html=backupPage()}else{ui.page='home';ui.unitId=null;html=home()}app.innerHTML=html;var ta=document.getElementById('summary');if(ta)ta.addEventListener('input',function(){unit().summary=ta.value;save()});var file=document.getElementById('import-file');if(file)file.addEventListener('change',importFile)}
function importFile(e){var file=e.target.files[0];if(!file)return;var reader=new FileReader();reader.onload=function(){try{var next=normalize(JSON.parse(String(reader.result)));if(!next)throw 0;if(confirm('현재 자료를 백업 내용으로 교체할까요?')){data=next;save();location.hash='#home';render()}}catch(err){var msg=document.getElementById('import-msg');if(msg){msg.hidden=false;msg.textContent='올바른 간호 공부 노트 JSON 파일인지 확인해 주세요.'}}};reader.readAsText(file)}
app.addEventListener('submit',function(e){e.preventDefault();var form=e.target;if(form.dataset.form==='unit'){var title=document.getElementById('new-unit').value.trim();if(title){var u={id:id(),title:title,example:false,summary:'',cards:[],quiz:null};data.subjects[0].units.push(u);save();location.hash='#unit-'+encodeURIComponent(u.id)}}else if(form.dataset.form==='card'){var term=document.getElementById('term').value.trim(),def=document.getElementById('definition').value.trim(),u=unit();if(term&&def){u.cards.push(card(term,def));save();render()}}else if(form.dataset.form==='edit-card'){var u=unit(),c=u.cards.find(function(x){return x.id===form.dataset.id});if(c){c.term=document.getElementById('edit-term').value.trim();c.def=document.getElementById('edit-def').value.trim();ui.editId=null;save();render()}}});
app.addEventListener('click',function(e){var el=e.target.closest('[data-action]');if(!el)return;var a=el.dataset.action,u=unit();if(a==='tab'){ui.tab=el.dataset.tab;ui.flipped=false;render();window.scrollTo(0,0)}else if(a==='flip'){ui.flipped=!ui.flipped;render()}else if(a==='prev'||a==='next'){if(u&&u.cards.length){ui.index=(ui.index+(a==='next'?1:-1)+u.cards.length)%u.cards.length;ui.flipped=false;render()}}else if(a==='known'){var c=u&&u.cards[ui.index];if(c){c.known=el.dataset.known==='true';ui.index=(ui.index+1)%u.cards.length;ui.flipped=false;save();render()}}else if(a==='rename'){var name=document.getElementById('rename').value.trim();if(name){u.title=name;save();render()}}else if(a==='delete-unit'){if(confirm('이 단원과 요약·카드를 삭제할까요?')){data.subjects[0].units=data.subjects[0].units.filter(function(x){return x.id!==u.id});save();location.hash='#subject'}}else if(a==='edit-card'){ui.editId=el.dataset.id;render()}else if(a==='cancel-edit'){ui.editId=null;render()}else if(a==='delete-card'){if(confirm('이 카드를 삭제할까요?')){u.cards=u.cards.filter(function(c){return c.id!==el.dataset.id});ui.index=0;save();render()}}else if(a==='start-quiz'){startQuiz(u);render()}else if(a==='answer'){var q=ui.quiz,item=q.qs[q.i];q.answer=el.dataset.value==='true';if(q.answer===item.truth)q.right++;else q.wrong.push(item.id);render()}else if(a==='quiz-next'){var q=ui.quiz;q.i++;q.answer=null;if(q.i>=q.qs.length){q.phase='result';q.score=Math.round(q.right/q.qs.length*100);u.quiz={best:Math.max(u.quiz?u.quiz.best:0,q.score),last:q.score};save()}render();window.scrollTo(0,0)}else if(a==='reset-quiz'){ui.quiz=null;render()}else if(a==='export'){var blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='간호공부노트-백업.json';link.click();setTimeout(function(){URL.revokeObjectURL(url)},1000)}else if(a==='import'){var input=document.getElementById('import-file');if(input&&input.files[0])importFile({target:input});else{var msg=document.getElementById('import-msg');msg.hidden=false;msg.textContent='먼저 백업 JSON 파일을 선택해 주세요.'}}});
window.addEventListener('hashchange',function(){render();window.scrollTo(0,0)});window.addEventListener('pagehide',function(){clearTimeout(timer);try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}});render();
})();
</script></body></html>
