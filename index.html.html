<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>나의 활동 기록</title>
  <style>
    :root {
      --bg: #f7f2ff;
      --surface: rgba(255,255,255,0.8);
      --surface-strong: #fff;
      --lavender: #e9ddff;
      --lavender-strong: #6957bd;
      --pink: #ffdfe9;
      --pink-strong: #b6587f;
      --mint: #dff5ec;
      --mint-strong: #2d7c66;
      --yellow: #fff3c8;
      --yellow-strong: #8a6300;
      --ink: #2d2a41;
      --muted: #635d7a;
      --line: rgba(109,87,210,0.16);
      --shadow: 0 18px 34px rgba(72, 58, 122, 0.08);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(circle at top right, rgba(255, 223, 233, 0.8), transparent 25%),
        radial-gradient(circle at bottom left, rgba(223, 245, 236, 0.8), transparent 28%),
        linear-gradient(180deg, #f9f3ff 0%, #fdf8ff 100%);
      font-family: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
      color: var(--ink);
    }

    body {
      padding: 28px 18px 64px;
    }

    .wrap {
      max-width: 620px;
      margin: 0 auto;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 20px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 92px;
      height: 40px;
      padding: 0 14px;
      border-radius: 999px;
      background: var(--lavender);
      color: var(--lavender-strong);
      font-weight: 800;
      font-size: 13px;
      letter-spacing: 0.04em;
      box-shadow: inset 0 0 0 1px rgba(105,87,189,0.1);
    }

    .title {
      margin: 0;
      font-size: clamp(30px, 5vw, 48px);
      line-height: 1.12;
      letter-spacing: -0.05em;
      font-weight: 900;
    }

    .subtitle {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.5;
    }

    .hero {
      position: relative;
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 16px;
      padding: 18px 18px 16px;
      background: linear-gradient(135deg, rgba(255,255,255,0.7), rgba(233,221,255,0.8));
      border: 1px solid var(--line);
      border-radius: 28px;
      box-shadow: var(--shadow);
      overflow: hidden;
      margin-bottom: 18px;
    }

    .hero::before,
    .hero::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      opacity: 0.9;
    }

    .hero::before {
      width: 110px;
      height: 110px;
      right: -12px;
      top: -18px;
      background: rgba(255, 223, 233, 0.9);
    }

    .hero::after {
      width: 66px;
      height: 66px;
      right: 78px;
      top: 54px;
      background: rgba(223,245,236,0.9);
    }

    .hero-copy {
      position: relative;
      z-index: 1;
    }

    .hero-tag {
      display: inline-block;
      margin-bottom: 10px;
      padding: 7px 12px;
      border-radius: 999px;
      background: rgba(255,255,255,0.55);
      color: var(--lavender-strong);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .hero-icon {
      position: relative;
      z-index: 1;
      width: 74px;
      height: 74px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, var(--pink), #ffe8b3);
      border-radius: 24px;
      font-size: 34px;
      box-shadow: 0 18px 28px rgba(173, 116, 145, 0.18);
    }

    .card {
      background: rgba(255,255,255,0.72);
      border: 1px solid var(--line);
      border-radius: 28px;
      box-shadow: var(--shadow);
      padding: 20px 18px 18px;
      margin-top: 18px;
      backdrop-filter: blur(8px);
    }

    .card.lavender { background: linear-gradient(180deg, rgba(233,221,255,.82), rgba(255,255,255,.78)); }
    .card.mint { background: linear-gradient(180deg, rgba(223,245,236,.82), rgba(255,255,255,.78)); }
    .card.yellow { background: linear-gradient(180deg, rgba(255,243,200,.82), rgba(255,255,255,.78)); }
    .card.pink { background: linear-gradient(180deg, rgba(255,223,233,.8), rgba(255,255,255,.78)); }

    .label {
      display: inline-block;
      margin-bottom: 12px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 0;
      border-bottom: 1px solid rgba(105,87,189,0.12);
    }

    .row:last-child { border-bottom: none; }

    .key {
      min-width: 110px;
      color: var(--muted);
      font-weight: 700;
      font-size: 14px;
    }

    .value {
      text-align: right;
      font-size: 18px;
      font-weight: 800;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .score {
      color: var(--lavender-strong);
      font-size: 26px;
      letter-spacing: -0.04em;
    }

    .certs {
      list-style: none;
      padding: 0;
      margin: 0;
      display: grid;
      gap: 10px;
    }

    .certs li {
      padding: 11px 14px;
      border-radius: 16px;
      background: rgba(255,255,255,0.42);
      border: 1px solid rgba(105,87,189,0.12);
      font-weight: 800;
      color: var(--ink);
    }

    .foot {
      margin-top: 18px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
    }

    @media (max-width: 420px) {
      body { padding-left: 14px; padding-right: 14px; }
      .row { align-items: flex-start; }
      .key { min-width: 96px; }
      .value { font-size: 16px; }
      .score { font-size: 22px; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <header class="topbar">
      <div>
        <h1 class="title">나의 활동 기록</h1>
        <p class="subtitle">꾸준히 쌓아가는 나만의 학습 로그</p>
      </div>
      <span class="badge">ACTIVITY</span>
    </header>

    <section class="hero" aria-label="활동 요약">
      <div class="hero-copy">
        <div class="hero-tag">record</div>
        <div style="font-size:14px; color:var(--muted); font-weight:700;">간호학과 활동 정리</div>
      </div>
      <div class="hero-icon" aria-hidden="true">✦</div>
    </section>

    <section class="card lavender" aria-labelledby="activity-label">
      <span class="label" id="activity-label">참여 기록</span>
      <div class="row"><span class="key">활동명</span><span class="value">고양이</span></div>
      <div class="row"><span class="key">날짜</span><span class="value">11월 9일</span></div>
      <div class="row"><span class="key">역할</span><span class="value">고양이 2</span></div>
    </section>

    <section class="card mint" aria-labelledby="score-label">
      <span class="label" id="score-label">성적</span>
      <div class="row"><span class="key">과목</span><span class="value score">인간관계와 대학생활</span></div>
      <div class="row"><span class="key">점수</span><span class="value score">78점</span></div>
    </section>

    <section class="card yellow" aria-labelledby="cert-label">
      <span class="label" id="cert-label">자격증</span>
      <ul class="certs">
        <li>ITQ</li>
        <li>기본인명구조사</li>
      </ul>
    </section>

    <section class="card pink" aria-labelledby="school-label">
      <span class="label" id="school-label">학교 활동</span>
      <div class="row"><span class="key">활동</span><span class="value">실습 준비</span></div>
    </section>

    <div class="foot">매일 조금씩 쌓아가는 나의 성장</div>
  </main>
</body>
</html>
